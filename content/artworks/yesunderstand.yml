          count: 3
      - speak:
          - 불량품? 어떻게 보면 맞지.
          - 근데 의사가 그러더라.
          - 사람 뇌가 양파랑 똑같다고.
          - 양파를 아주 얇게 자르면 모양이 다 다르잖아.
          - 사람 뇌도 그렇다는 거야.
          - CT를 찍으면 그렇게 나온대.
          - 그러니까 네가 스스로 불량품 같다고 느끼는 건,
          - 누구는 키가 작고,
          - 누구는 키가 큰 것처럼
          - 다 다르게 생긴거라는 거지.
        background:
          image: yesunderstand/ct-brain.jpg
          dim: 0.7
      - reply:
          pool: 전체
          count: 3
      - speak:
          - 근데 평균치가 있잖아.
          - |-
            결과표, 통계를 딱 보면 폭이 넓은데
            그 안에 들어가기가 어렵단 말이야.
          - 그러니까, 생각을 해보면
          - 모든 게 절대적인 평균치의 딱 중간에
          - 들어맞는 인간이
          - 정상이겠냐고.
          - 결론은 우리 모두 어딘가 고장 난 불량품이라는 거야.
          - 생각해봐,
          - 키가 너무 작으면 작아서,
          - 너무 크면 커서 비정상이 되잖아.
          - 평균치에 들어가지 않으면 불량품이 되는 거지.
      - reply:
