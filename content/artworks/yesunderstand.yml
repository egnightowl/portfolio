  sympathy:
    label: Sympathy
    steps:
      - title:
          small: 세 번째 이야기
          big: ""
          en: Sympathy
      - speak:
          - 많이 힘들었나보네, 네가 그런 이야길 다 하고.
          - 나도 많이 힘들었을 땐 나 혼자만 이상한 존재인가 싶어서 많이 힘들었어.
      - reply:
