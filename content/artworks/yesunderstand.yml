# 오해의 오해 (yes, understand.) — 대화 대본
# speak: 만나서 하는 말 — 화면 가운데 자막처럼 (한 줄 = 한 문단, "pause"는 잠깐 멈춤)
#   background: 그 말이 나오는 동안의 배경
#     - { image: yesunderstand/파일이름.jpg, dim: 0.7 }   (content/artworks/ 안의 이미지, dim = 어둡게 0~1)
#     - { video: yesunderstand/파일이름.mp4, dim: 0.5 }
#     - { youtube: 유튜브영상ID }                          (youtu.be/ 뒤의 글자)
#     - { color: "#000" }
# chat: 휴대폰 문자 (한 줄 = 말풍선 하나)
# title: 이야기 제목 화면 { small: 첫 번째 이야기, big: 우스갯소리, en: Humor }
# reply: 관객이 고를 답장 — 무엇을 골라도 친구는 자기 이야기를 계속해요
#   - 직접 적기:        reply: [응, 아니]
#   - 꾸러미에서 뽑기:  reply: { pool: 공감, count: 3 }     (pool: 전체 = 모든 꾸러미에서 무작위)
#   - 여러 꾸러미 섞기: reply: { pool: [농담, 딴소리], count: 2 }
#   - 갈림길:           reply: [{ text: 그 얘기 더 해줘, go: humor }, 그만하자]   (go = 이동할 이야기)
# reply_pools: 답장 문구 꾸러미 — 이름도, 개수도 자유롭게 늘리세요
# choices: 첫 질문에 대한 답장 → 각각 다른 이야기(stories)로 이어져요

title: 오해의 오해 (yes, understand.)
year: 2020
contact: 친구
start_button: 알람 확인하기
opening:
  - chat:
      - 안녕, 오랜만이다!
  - reply:
      - 안녕!
  - chat:
      - 그동안 연락도 없고, 서운해~
  - reply:
      - 미안ㅋㅋ. 어떻게 지냈어?
  - chat:
      - 나야 뭐 그냥 그렇지 뭐, 회사 다니고 뭐하고 바빠. 너는?
reply_pools:
  맞장구:
    - 응응
    - 그렇구나
    - 맞아
    - 오 진짜?
    - 그치
    - 음..
    - ㅇㅇ
    - 그래서?
  공감:
    - 무슨 말인지 알 것 같아
    - 나도 그런 적 있어
    - 많이 힘들었겠다
    - 그럴 수 있지
    - 괜찮아?
    - 그 마음 알아
  농담:
    - ㅋㅋㅋ 갑자기?
    - 너 또 시작이다
    - 철학자 납셨네
    - ㅋㅋ 그게 뭐야
    - 오늘따라 진지하네
  딴소리:
    - 근데 너 밥은 먹었어?
    - 아 맞다, 나 할 말 있었는데
    - 요즘 날씨 이상하지 않아?
    - 그 얘기는 왜?
    - 우리 언제 한번 보자
  거리두기:
    - 너무 깊게 생각하는 거 아냐?
    - 그건 좀 아니지 않아?
    - 나는 잘 모르겠어
    - 음 글쎄..
    - 그런가?
choices:
  - text: 나 복권 당첨돼서 귀농 준비해.
    story: humor
  - text: 예전이랑 똑같지 뭐. 한 것도 없는데 나이만 먹었다.
    story: consolation
  - text: 요즘 좀 힘들었어. 그래도 네 얼굴 보니 좋다.
    story: sympathy
  - text: 집에만 있었어. 오늘도 어찌나 눈치가 보이던지..
