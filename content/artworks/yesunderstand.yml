          - 에휴.. 니가 눈치볼게 뭐가 있냐.
          - 태어난게 죄냐?
          - 그치, 가끔은 사람 한명 몫 하는게 그렇게 힘들 수가 없어.
          - 너무 기죽지 마.
          - 너 설마 네가 혐오 대상이니 뭐니 그렇게 생각하는 건 아니지?
          - 전에 그런 얘기했었잖아. 걱정돼서 그래.
          - 우울해하지말고, 얘기 하나 해줄게.
