# 자기소개 (About) — ko: 국문, en: 영문

ko:
  tag: |-
    제작 전 과정을 이해하고 설계하는
    ==교육 콘텐츠 디자이너==
  sections:
    - title: 소개
      text: |-
        성균관대학교에서 서양화를 전공하고, 현재 이화여자대학교 교육대학원에서 교육공학·HRD 석사 과정을 밟고 있습니다. 이러닝 기획사에서 K-MOOC 프로젝트 PL로 일하며 대학생부터 직장인까지 폭넓은 성인 학습자를 위한 교육 콘텐츠를 만들어왔고, 지금은 프리랜서 스토리보드 설계자로 삼성·롯데·KT&G 등 기업 직무 교육을 설계하고 있습니다.

        미술을 전공하며 익힌 '복잡한 개념을 시각 언어로 구조화하고, 보는 사람의 해석 과정을 먼저 고려하는' 태도는 지금 제 일의 토대가 되었습니다. 작업을 만들어 전시하고 누군가의 해석으로 완성되는 과정과, 콘텐츠를 설계해 누군가의 배움으로 이어지는 과정이 닮아 있다고 느낍니다.
    - title: 일하는 방식
      text: "주관적 감각이 아니라 '학습 목표'와 '제작 여건'이라는 객관적 기준에 맞춰 정보를 구조화합니다. “왜 이 교육이 필요한가, 어떻게 만들 것인가”를 가장 먼저 정의합니다. 최대 5~6개 프로젝트를 동시에 운영하며 PM·고객사·SME·내부 개발팀의 일정을 조율해온 매니징 경험이 있고, 공유 캘린더와 조기 방향 합의로 수정 소요를 줄이는 것이 습관이 되어 있습니다. 특기는 어려운 기술 정보를 비전공자도 직관적으로 이해할 수 있는 스토리보드로 바꾸는 것이며(예: 삼성전자 사내 안전교육), 평소 레퍼런스 영상을 분석하고 AI를 학습·콘텐츠 설계에 적극적으로 활용합니다."
    - title: 지금, 그리고 앞으로
      text: 실무에서 '어떻게 만들지'에 집중해왔다면, 이제는 '어떤 방식으로 학습자의 이해도를 높일 것인가'라는 교육공학적 원리에 집중하고자 대학원에 진학했습니다. 현장에서 쌓은 데이터와 경험을 이론으로 체계화해, 아름다움과 학습 논리를 동시에 충족하는 교육 콘텐츠를 설계하는 전문가로 성장하는 것이 목표입니다.
en:
  tag: |-
    Instructional Content Designer
    ==Yujin Koh==, bridging design and technology.
  sections:
    - title: ABOUT
      text: |-
        I studied Western painting at Sungkyunkwan University and am currently pursuing a master's in Educational Technology & HRD at the Graduate School of Education, Ewha Womans University. As a project lead at an e-learning studio, I produced K-MOOC courses for a wide range of adult learners—from university students to working professionals—and I now work as a freelance storyboard designer, creating corporate training content across finance, manufacturing, and public-sector clients.

        The mindset I developed in fine art—structuring complex ideas into visual language and considering the viewer's interpretation first—became the foundation of my work today. I see a close parallel between a piece of art that is completed through someone's interpretation and content that is completed through someone's learning.
    - title: NOW I WORK
      text: I structure information against objective criteria—learning objectives and production constraints—rather than personal taste, starting always with “why this training is needed and how it should be built.” I've run up to five or six projects at once, coordinating schedules across PMs, clients, subject-matter experts, and internal development teams, and I rely on shared calendars and early alignment to minimize revision cycles. My strength is turning difficult technical information into storyboards that non-experts can grasp intuitively, and I actively use AI in both learning and content design.
    - title: NOW, AND AHEAD
      text: Having focused on how to build content in the field, I entered graduate school to study how learning actually deepens understanding. My goal is to systematize the experience I've gathered on the ground into theory, and to design educational content that satisfies both aesthetic quality and sound learning logic.
